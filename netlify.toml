[build]
  base = "frontend"
  publish = "../app/static"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://codex-lb-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health/*"
  to = "https://codex-lb-backend.onrender.com/health/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
